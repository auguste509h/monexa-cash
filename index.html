  });

  function monexaOpenProfile(){
    const panel=document.getElementById("mx-profile-panel");

    if(panel){
      panel.classList.add("active");
    }
  }

  function monexaCloseProfile(event){

    if(event && event.target!==event.currentTarget){
      return;
    }

    const panel=document.getElementById("mx-profile-panel");

    if(panel){
      panel.classList.remove("active");
    }
  }
</script>

<script>
  document.addEventListener("DOMContentLoaded",function(){

    const profileBox=document.querySelector(".mx-profile-box");

    if(!profileBox || document.getElementById("mx-profile-extra")){
      return;
    }

    const extra=document.createElement("div");

    extra.id="mx-profile-extra";

    extra.innerHTML=`
      <div class="mx-profile-avatar">
        👤
      </div>

      <div class="mx-profile-center">
        <h3>Mon compte</h3>
        <p>Gérez votre compte MONEXA CASH</p>
      </div>

      <div class="mx-profile-actions">

        <button
          type="button"
          class="mx-profile-action"
          onclick="monexaProfileTest('Informations personnelles')">
          <span>👤</span>
          Informations personnelles
        </button>

        <button
          type="button"
          class="mx-profile-action"
          onclick="monexaProfileTest('Historique des transactions')">
          <span>↕</span>
          Historique des transactions
        </button>

        <div class="mx-profile-action mx-dark-row">

          <div>
            <span>🌙</span>
            Mode sombre
          </div>

          <label class="mx-switch">
            <input
              id="mx-dark-toggle"
              type="checkbox"
              onchange="monexaToggleDark(this)">
            <span class="mx-slider"></span>
          </label>

        </div>

        <button
          type="button"
          class="mx-profile-action"
          onclick="monexaProfileTest('Assistance')">
          <span>🆘</span>
          Assistance
        </button>

      </div>

      <div class="mx-help-box">

        <strong>Besoin d'aide ?</strong>

        <p>
          Si l'assistance n'est pas disponible,
          vous pouvez nous contacter directement sur WhatsApp.
        </p>

        <a
          class="mx-whatsapp-link"
          href="https://wa.me/50940886629"
          target="_blank"
          rel="noopener noreferrer">
          💬 Contacter MONEXA CASH sur WhatsApp
        </a>

      </div>
    `;

    profileBox.appendChild(extra);

    const savedTheme=localStorage.getItem("monexa_dark_mode");

    if(savedTheme==="true"){

      document.body.classList.add("mx-dark");

      const toggle=document.getElementById("mx-dark-toggle");

      if(toggle){
        toggle.checked=true;
      }
    }
  });

  function monexaToggleDark(input){

    const enabled=input.checked;

    document.body.classList.toggle("mx-dark",enabled);

    localStorage.setItem(
      "monexa_dark_mode",
      enabled ? "true" : "false"
    );
  }

  function monexaProfileTest(section){

    alert(
      section +
      "\n\nCette fonction sera connectée au compte client dans une prochaine étape."
    );
  }
</script>

    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:3px;
    cursor:pointer;
    transition:.2s ease;
  }

  .mx-nav-icon{
    width:34px;
    height:32px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:12px;
    font-size:18px;
    transition:.2s ease;
  }

  .mx-nav-label{
    font-size:10px;
    font-weight:700;
    letter-spacing:.1px;
  }

  .mx-nav-item.active{
    color:#0aaaa5;
    background:#e9fbfa;
  }

  .mx-nav-item.active .mx-nav-icon{
    transform:translateY(-1px);
  }

  .mx-nav-item:active{
    transform:scale(.94);
  }

  #app{
    padding-bottom:110px !important;
  }

  body.mx-dark .mx-bottom-nav{
    background:rgba(13,27,43,.96);
    border-color:rgba(255,255,255,.08);
    box-shadow:0 12px 35px rgba(0,0,0,.35);
  }

  body.mx-dark .mx-nav-item{
    color:#8e9bad;
  }

  body.mx-dark .mx-nav-item.active{
    color:#20d9d2;
    background:rgba(32,217,210,.12);
  }
</style>

<script>
  document.addEventListener("DOMContentLoaded",function(){

    if(document.getElementById("mx-bottom-nav")){
      return;
    }

    const nav=document.createElement("nav");

    nav.id="mx-bottom-nav";
    nav.className="mx-bottom-nav";

    nav.innerHTML=`
      <button
        type="button"
        class="mx-nav-item active"
        onclick="monexaNavTest(this,'Accueil')">

        <div class="mx-nav-icon">⌂</div>
        <div class="mx-nav-label">Accueil</div>

      </button>

      <button
        type="button"
        class="mx-nav-item"
        onclick="monexaNavTest(this,'Services')">

        <div class="mx-nav-icon">▦</div>
        <div class="mx-nav-label">Services</div>

      </button>

      <button
        type="button"
        class="mx-nav-item"
        onclick="monexaNavTest(this,'Transactions')">

        <div class="mx-nav-icon">↕</div>
        <div class="mx-nav-label">Transactions</div>

      </button>

      <button
        type="button"
        class="mx-nav-item"
        onclick="monexaNavTest(this,'Profil')">

        <div class="mx-nav-icon">◉</div>
        <div class="mx-nav-label">Profil</div>

      </button>
    `;

    document.body.appendChild(nav);
  });

  function monexaNavTest(button,page){

    document
      .querySelectorAll(".mx-nav-item")
      .forEach(function(item){
        item.classList.remove("active");
      });

    button.classList.add("active");

    if(page==="Profil"){

      if(typeof monexaOpenProfile==="function"){
        monexaOpenProfile();
        return;
      }
    }

    alert(
      page +
      "\n\nCette section sera connectée dans une prochaine étape."
    );
  }
</script>

</body>
</html>
