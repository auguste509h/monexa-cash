<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>MONEXA CASH</title>

  <!-- Connexion à Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f4f7fb;
      color: #172033;
    }

    header {
      background: #0b1f3a;
      color: white;
      padding: 30px 20px;
      text-align: center;
    }

    header h1 {
      font-size: 32px;
      margin-bottom: 8px;
    }

    header p {
      font-size: 15px;
      opacity: 0.9;
    }

    .container {
      max-width: 600px;
      margin: auto;
      padding: 25px 18px;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 22px;
      margin-top: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.06);
    }

    h2 {
      text-align: center;
      margin-bottom: 18px;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-top: 10px;
      border: 1px solid #d0d5dd;
      border-radius: 10px;
      font-size: 15px;
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 15px;
      border: none;
      border-radius: 10px;
      background: #0b1f3a;
      color: white;
      font-size: 16px;
      font-weight: bold;
    }

    .secondary {
      background: #667085;
    }

    .link {
      background: transparent;
      color: #0b1f3a;
      font-size: 14px;
    }

    .hidden {
      display: none;
    }

    .message {
      margin-top: 15px;
      padding: 12px;
      border-radius: 10px;
      background: #f2f4f7;
      font-size: 14px;
      text-align: center;
    }

    .services {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-top: 20px;
    }

    .service {
      background: #f8fafc;
      border-radius: 14px;
      padding: 20px 10px;
      text-align: center;
      border: 1px solid #eaecf0;
    }

    .icon {
      font-size: 30px;
      margin-bottom: 8px;
    }

    .service h3 {
      font-size: 16px;
      margin-bottom: 5px;
    }

    .service p {
      font-size: 12px;
      color: #667085;
    }

    footer {
      text-align: center;
      padding: 25px 15px;
      color: #667085;
      font-size: 13px;
    }
  </style>
</head>

<body>

<header>
  <h1>MONEXA CASH</h1>
  <p>Plateforme de services financiers numériques</p>
</header>

<div class="container">

  <!-- CONNEXION -->
  <div id="loginSection" class="card">

    <h2>Connexion</h2>

    <input
      type="email"
      id="loginEmail"
      placeholder="Adresse e-mail"
    >

    <input
      type="password"
      id="loginPassword"
      placeholder="Mot de passe"
    >

    <button onclick="login()">
      Se connecter
    </button>

    <button
      class="link"
      onclick="showRegister()"
    >
      Créer un compte
    </button>

    <div
      id="loginMessage"
      class="message hidden">
    </div>

  </div>


  <!-- INSCRIPTION -->
  <div id="registerSection" class="card hidden">

    <h2>Créer un compte</h2>

    <input
      type="text"
      id="registerName"
      placeholder="Nom complet"
    >

    <input
      type="tel"
      id="registerPhone"
      placeholder="Numéro de téléphone"
    >

    <input
      type="email"
      id="registerEmail"
      placeholder="Adresse e-mail"
    >

    <input
      type="password"
      id="registerPassword"
      placeholder="Mot de passe"
    >

    <button onclick="register()">
      Créer mon compte
    </button>

    <button
      class="link"
      onclick="showLogin()"
    >
      J'ai déjà un compte
    </button>

    <div
      id="registerMessage"
      class="message hidden">
    </div>

  </div>


  <!-- ESPACE CLIENT -->
  <div id="dashboardSection" class="card hidden">

    <h2>Bienvenue 👋</h2>

    <p
      id="userEmail"
      style="text-align:center;color:#667085;">
    </p>

    <div class="services">

      <div class="service">
        <div class="icon">💳</div>
        <h3>Recharge</h3>
        <p>Rechargez votre compte</p>
      </div>

      <div class="service">
        <div class="icon">💸</div>
        <h3>Transfert</h3>
        <p>Envoyez de l'argent</p>
      </div>

      <div class="service">
        <div class="icon">🏦</div>
        <h3>Retrait</h3>
        <p>Demandez un retrait</p>
      </div>

      <div class="service">
        <div class="icon">🛒</div>
        <h3>Paiement</h3>
        <p>Effectuez un paiement</p>
      </div>

    </div>

    <button
      class="secondary"
      onclick="logout()">
      Se déconnecter
    </button>

    <div
      id="dashboardMessage"
      class="message hidden">
    </div>

  </div>

</div>

<footer>
  © 2026 MONEXA CASH — Tous droits réservés.
</footer>


<script>

  /* =================================
     CONFIGURATION SUPABASE
  ================================= */

  const SUPABASE_URL =
    "https://nakaajakjrefzmacqlhv.supabase.co";

  const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_KVnwapImIKdKXMFZh5e9IA_7UflvhaN";


  /* =================================
     INITIALISATION SUPABASE
  ================================= */

  const db = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );


  /* =================================
     MESSAGES
  ================================= */

  function showMessage(id, message) {

    const element = document.getElementById(id);

    element.textContent = message;

    element.classList.remove("hidden");
  }


  /* =================================
     PAGE CONNEXION
  ================================= */

  function showLogin() {

    document
      .getElementById("loginSection")
      .classList.remove("hidden");

    document
      .getElementById("registerSection")
      .classList.add("hidden");

    document
      .getElementById("dashboardSection")
      .classList.add("hidden");

  }


  /* =================================
     PAGE INSCRIPTION
  ================================= */

  function showRegister() {

    document
      .getElementById("loginSection")
      .classList.add("hidden");

    document
      .getElementById("registerSection")
      .classList.remove("hidden");

    document
      .getElementById("dashboardSection")
      .classList.add("hidden");

  }


  /* =================================
     CRÉER UN COMPTE
  ================================= */

  async function register() {

    const name =
      document.getElementById("registerName")
      .value
      .trim();

    const phone =
      document.getElementById("registerPhone")
      .value
      .trim();

    const email =
      document.getElementById("registerEmail")
      .value
      .trim();

    const password =
      document.getElementById("registerPassword")
      .value;


    if (!name || !phone || !email || !password) {

      showMessage(
        "registerMessage",
        "Veuillez remplir tous les champs."
      );

      return;
    }


    if (password.length < 6) {

      showMessage(
        "registerMessage",
        "Le mot de passe doit contenir au moins 6 caractères."
      );

      return;
    }


    const { error } =
      await db.auth.signUp({

        email: email,

        password: password,

        options: {

          data: {

            full_name: name,

            phone: phone

          }

        }

      });


    if (error) {

      showMessage(
        "registerMessage",
        error.message
      );

      return;
    }


    showMessage(
      "registerMessage",
      "Compte créé avec succès. Vous pouvez maintenant vous connecter."
    );

  }


  /* =================================
     CONNEXION
  ================================= */

  async function login() {

    const email =
      document.getElementById("loginEmail")
      .value
      .trim();

    const password =
      document.getElementById("loginPassword")
      .value;


    if (!email || !password) {

      showMessage(
        "loginMessage",
        "Veuillez entrer votre e-mail et votre mot de passe."
      );

      return;
    }


    const { data, error } =
      await db.auth.signInWithPassword({

        email: email,

        password: password

      });


    if (error) {

      showMessage(
        "loginMessage",
        error.message
      );

      return;
    }


    showDashboard(data.user);

  }


  /* =================================
     TABLEAU DE BORD
  ================================= */

  function showDashboard(user) {

    document
      .getElementById("loginSection")
      .classList.add("hidden");

    document
      .getElementById("registerSection")
      .classList.add("hidden");

    document
      .getElementById("dashboardSection")
      .classList.remove("hidden");


    document
      .getElementById("userEmail")
      .textContent =
      user.email;

  }


  /* =================================
     DÉCONNEXION
  ================================= */

  async function logout() {

    await db.auth.signOut();

    showLogin();

  }


  /* =================================
     VÉRIFIER SESSION
  ================================= */

  async function checkSession() {

    const { data } =
      await db.auth.getSession();


    if (data.session) {

      showDashboard(
        data.session.user
      );

    } else {

      showLogin();

    }

  }


  /* =================================
     DÉMARRAGE
  ================================= */

  checkSession();

</script>

</body>
  </html>
