<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MONEXA CASH</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #172033;
    }

    header {
      background: #0b1f3a;
      color: white;
      text-align: center;
      padding: 30px 15px;
    }

    .container {
      max-width: 600px;
      margin: auto;
      padding: 20px;
    }

    .card {
      background: white;
      padding: 22px;
      border-radius: 16px;
      margin-top: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,.06);
    }

    input {
      width: 100%;
      padding: 14px;
      margin-top: 10px;
      box-sizing: border-box;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 15px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 15px;
      border: 0;
      border-radius: 10px;
      background: #0b1f3a;
      color: white;
      font-size: 16px;
      font-weight: bold;
    }

    .link {
      background: transparent;
      color: #0b1f3a;
    }

    .hidden {
      display: none;
    }

    #message {
      margin-top: 15px;
      padding: 12px;
      text-align: center;
    }
  </style>
</head>

<body>

<header>
  <h1>MONEXA CASH</h1>
  <p>Plateforme de services financiers numériques</p>
</header>

<div class="container">

  <div id="loginSection" class="card">

    <h2>Connexion</h2>

    <input
      type="email"
      id="email"
      placeholder="Adresse e-mail"
    >

    <input
      type="password"
      id="password"
      placeholder="Mot de passe"
    >

    <button id="loginButton">
      Se connecter
    </button>

    <button
      class="link"
      id="registerButton">
      Créer un compte
    </button>

    <div id="message"></div>

  </div>


  <div id="dashboard" class="card hidden">

    <h2>Bienvenue 👋</h2>

    <p id="userEmail"></p>

    <p>Connexion réussie.</p>

    <button id="logoutButton">
      Se déconnecter
    </button>

  </div>

</div>


<script>

const SUPABASE_URL =
  "https://nakaajakjrefzmacqlhv.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_KVnwapImIKdKXMFZh5e9IA_7UflvhaN";

const db = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY
);


const loginButton =
  document.getElementById("loginButton");

const message =
  document.getElementById("message");


loginButton.addEventListener("click", async function() {

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;


  if (!email || !password) {

    message.textContent =
      "Veuillez entrer votre e-mail et votre mot de passe.";

    return;
  }


  message.textContent =
    "Connexion en cours...";


  const { data, error } =
    await db.auth.signInWithPassword({
      email: email,
      password: password
    });


  if (error) {

    message.textContent =
      error.message;

    return;
  }


  document
    .getElementById("loginSection")
    .classList.add("hidden");

  document
    .getElementById("dashboard")
    .classList.remove("hidden");

  document
    .getElementById("userEmail")
    .textContent =
    data.user.email;

});


document
  .getElementById("logoutButton")
  .addEventListener("click", async function() {

    await db.auth.signOut();

    location.reload();

  });


</script>

</body>
</html>
