<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>MONEXA CASH</title>

  <style>
    *{
      box-sizing:border-box;
      margin:0;
      padding:0;
    }

    body{
      font-family:Arial,Helvetica,sans-serif;
      background:#f5f8fc;
      color:#10233f;
      min-height:100vh;
    }

    #app{
      width:100%;
      max-width:480px;
      min-height:100vh;
      margin:auto;
      background:#ffffff;
      padding:24px 18px;
    }

    .logo{
      width:58px;
      height:58px;
      border-radius:18px;
      background:#0b1f3a;
      color:#20d9d2;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:24px;
      font-weight:800;
      margin-bottom:18px;
    }

    h1{
      font-size:28px;
      margin-bottom:8px;
    }

    .subtitle{
      color:#667085;
      font-size:15px;
      line-height:1.5;
      margin-bottom:30px;
    }

    .test-card{
      background:#0b1f3a;
      color:#ffffff;
      border-radius:22px;
      padding:24px;
      box-shadow:0 12px 30px rgba(11,31,58,.15);
    }

    .test-card p{
      color:#d7e2f0;
      margin-top:8px;
      line-height:1.5;
    }

    button{
      width:100%;
      border:0;
      border-radius:14px;
      padding:14px;
      margin-top:20px;
      background:#20d9d2;
      color:#06252b;
      font-size:16px;
      font-weight:700;
      cursor:pointer;
    }
  </style>
</head>

<body>

  <div id="app">

    <div class="logo">MC</div>

    <h1>MONEXA CASH</h1>

    <p class="subtitle">
      Plateforme de services financiers numériques
    </p>

    <div class="test-card">
      <h2>Bienvenue</h2>
      <p>
        La nouvelle plateforme MONEXA CASH commence ici.
      </p>

      <button type="button" onclick="testMonexa()">
        Tester l'application
      </button>
    </div>

  </div>

  <script>
    function testMonexa(){
      alert("MONEXA CASH fonctionne correctement !");
    }
  </script>

  <style>
  .mx-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:28px;
  }

  .mx-brand{
    display:flex;
    align-items:center;
    gap:10px;
  }

  .mx-logo{
    width:42px;
    height:42px;
    border-radius:13px;
    background:#0b1f3a;
    color:#20d9d2;
    display:flex;
    align-items:center;
    justify-content:center;
    font-weight:800;
    font-size:17px;
  }

  .mx-brand-name{
    font-size:17px;
    font-weight:800;
    color:#10233f;
  }

  .mx-profile-btn{
    width:44px;
    height:44px;
    border-radius:50%;
    border:2px solid #20d9d2;
    background:#e8fbfa;
    color:#0b1f3a;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:20px;
    cursor:pointer;
  }

  .mx-greeting{
    margin-bottom:18px;
  }

  .mx-greeting small{
    color:#7a8799;
    font-size:14px;
  }

  .mx-greeting h2{
    margin-top:5px;
    font-size:24px;
    color:#10233f;
  }

  .mx-balance{
    background:linear-gradient(135deg,#0b1f3a,#12345d);
    color:#fff;
    border-radius:24px;
    padding:24px;
    margin-bottom:22px;
    box-shadow:0 14px 30px rgba(11,31,58,.18);
  }

  .mx-balance-label{
    color:#c9d7e8;
    font-size:14px;
  }

  .mx-balance-value{
    font-size:32px;
    font-weight:800;
    margin-top:8px;
  }

  .mx-balance-currency{
    color:#20d9d2;
    font-size:14px;
    font-weight:700;
  }

  .mx-actions{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
    margin-bottom:28px;
  }

  .mx-action{
    border:1px solid #e5eaf1;
    background:#fff;
    border-radius:17px;
    padding:15px 8px;
    text-align:center;
    font-size:13px;
    font-weight:700;
    color:#10233f;
    cursor:pointer;
  }

  .mx-action-icon{
    width:40px;
    height:40px;
    border-radius:13px;
    margin:0 auto 9px;
    background:#e8fbfa;
    color:#0aaaa5;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:19px;
  }

  .mx-section-title{
    font-size:18px;
    font-weight:800;
    margin-bottom:13px;
    color:#10233f;
  }

  .mx-services-card{
    background:#f8fafc;
    border:1px solid #e7edf4;
    border-radius:20px;
    padding:20px;
  }

  .mx-services-card h3{
    color:#10233f;
    margin-bottom:7px;
  }

  .mx-services-card p{
    color:#718096;
    line-height:1.5;
    font-size:14px;
  }

  .mx-profile-panel{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(7,20,38,.45);
    z-index:9999;
    align-items:flex-end;
  }

  .mx-profile-panel.active{
    display:flex;
  }

  .mx-profile-box{
    width:100%;
    max-width:480px;
    margin:auto;
    background:#fff;
    border-radius:26px 26px 0 0;
    padding:24px 20px 30px;
  }

  .mx-profile-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:22px;
  }

  .mx-profile-top h3{
    font-size:20px;
    color:#10233f;
  }

  .mx-close-profile{
    width:36px;
    height:36px;
    border:0;
    border-radius:50%;
    background:#f1f4f8;
    font-size:20px;
    cursor:pointer;
  }

  .mx-account-info{
    background:#f7f9fc;
    border-radius:18px;
    padding:17px;
  }

  .mx-info-row{
    padding:12px 0;
    border-bottom:1px solid #e5eaf1;
  }

  .mx-info-row:last-child{
    border-bottom:0;
  }

  .mx-info-label{
    display:block;
    color:#7a8799;
    font-size:12px;
    margin-bottom:4px;
  }

  .mx-info-value{
    color:#10233f;
    font-weight:700;
    font-size:14px;
  }
</style>

<script>
  document.addEventListener("DOMContentLoaded",function(){

    const app=document.getElementById("app");

    if(!app) return;

    app.innerHTML=`
      <div class="mx-header">

        <div class="mx-brand">
          <div class="mx-logo">MC</div>
          <div class="mx-brand-name">MONEXA CASH</div>
        </div>

        <button
          class="mx-profile-btn"
          type="button"
          onclick="monexaOpenProfile()"
          aria-label="Profil">
          👤
        </button>

      </div>

      <div class="mx-greeting">
        <small>Bonsoir 👋</small>
        <h2>Bienvenue sur MONEXA CASH</h2>
      </div>

      <div class="mx-balance">

        <div class="mx-balance-label">
          Solde disponible
        </div>

        <div class="mx-balance-value">
          0.00
          <span class="mx-balance-currency">HTG</span>
        </div>

      </div>

      <div class="mx-actions">

        <button
          class="mx-action"
          type="button"
          onclick="alert('La section Déposer sera ajoutée dans la prochaine étape.')">

          <div class="mx-action-icon">＋</div>
          Déposer
        </button>

        <button
          class="mx-action"
          type="button"
          onclick="alert('La section Envoyer sera ajoutée dans la prochaine étape.')">

          <div class="mx-action-icon">↗</div>
          Envoyer
        </button>

        <button
          class="mx-action"
          type="button"
          onclick="alert('La section Retirer sera ajoutée dans la prochaine étape.')">

          <div class="mx-action-icon">↙</div>
          Retirer
        </button>

      </div>

      <div class="mx-section-title">
        Services
      </div>

      <div class="mx-services-card">
        <h3>MONEXA CASH</h3>
        <p>
          Votre portefeuille numérique simple, rapide et sécurisé.
        </p>
      </div>

      <div
        id="mx-profile-panel"
        class="mx-profile-panel"
        onclick="monexaCloseProfile(event)">

        <div
          class="mx-profile-box"
          onclick="event.stopPropagation()">

          <div class="mx-profile-top">

            <h3>Mon profil</h3>

            <button
              class="mx-close-profile"
              type="button"
              onclick="monexaCloseProfile()">
              ×
            </button>

          </div>

          <div class="mx-account-info">

            <div class="mx-info-row">
              <span class="mx-info-label">Nom complet</span>
              <span class="mx-info-value">Non connecté</span>
            </div>

            <div class="mx-info-row">
              <span class="mx-info-label">E-mail</span>
              <span class="mx-info-value">Non connecté</span>
            </div>

            <div class="mx-info-row">
              <span class="mx-info-label">Téléphone</span>
              <span class="mx-info-value">Non renseigné</span>
            </div>

          </div>

        </div>

      </div>
    `;

  });

  function monexaOpenProfile(){
    const panel=document.getElementById("mx-profile-panel");

    if(panel){
      panel.classList.add("active");
    }
  }

  function monexaCloseProfile(event){

    if(event && event.target!==event.currentTarget){
      return;
    }

    const panel=document.getElementById("mx-profile-panel");

    if(panel){
      panel.classList.remove("active");
    }
  }
</script>

</body>
</html>
