<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>MONEXA CASH</title>

  <style>
    *{
      box-sizing:border-box;
      margin:0;
      padding:0;
    }

    body{
      font-family:Arial,Helvetica,sans-serif;
      background:#f5f8fc;
      color:#071d38;
      min-height:100vh;
    }

    button,
    input,
    select{
      font:inherit;
    }

    button{
      cursor:pointer;
    }

    .app{
      width:100%;
      max-width:520px;
      min-height:100vh;
      margin:auto;
      background:#f5f8fc;
      padding-bottom:95px;
    }

    .header{
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:20px 18px 14px;
    }

    .brand{
      display:flex;
      align-items:center;
      gap:11px;
    }

    .logo{
      width:46px;
      height:46px;
      border-radius:15px;
      display:flex;
      align-items:center;
      justify-content:center;
      background:#071d38;
      color:#19d3c5;
      font-size:17px;
      font-weight:900;
    }

    .brand-name{
      font-size:17px;
      font-weight:900;
      letter-spacing:.3px;
    }

    .profile-btn{
      width:44px;
      height:44px;
      border:0;
      border-radius:50%;
      background:#fff;
      color:#071d38;
      box-shadow:0 5px 18px rgba(7,29,56,.08);
    }

    .welcome{
      padding:8px 18px 20px;
    }

    .welcome small{
      color:#718096;
      font-size:13px;
    }

    .welcome h1{
      margin-top:5px;
      font-size:25px;
      line-height:1.2;
    }

    .balance{
      margin:0 18px 20px;
      padding:24px 21px;
      border-radius:25px;
      background:#071d38;
      color:#fff;
      box-shadow:0 15px 35px rgba(7,29,56,.16);
    }

    .balance-label{
      color:#b9c8d8;
      font-size:13px;
      margin-bottom:8px;
    }

    .balance-value{
      font-size:31px;
      font-weight:900;
      letter-spacing:.3px;
    }

    .balance-currency{
      font-size:14px;
      color:#19d3c5;
      margin-left:4px;
    }

    .actions{
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:10px;
      padding:0 18px;
      margin-bottom:26px;
    }

    .action{
      border:0;
      background:#fff;
      border-radius:20px;
      padding:15px 8px;
      color:#071d38;
      font-weight:800;
      box-shadow:0 6px 20px rgba(7,29,56,.06);
    }

    .action-icon{
      width:38px;
      height:38px;
      margin:0 auto 8px;
      border-radius:13px;
      display:flex;
      align-items:center;
      justify-content:center;
      background:#e9fbfa;
      color:#087f79;
      font-size:20px;
    }

    .section-title{
      padding:0 18px 12px;
      font-size:17px;
      font-weight:900;
    }

    .services{
      display:grid;
      grid-template-columns:repeat(2,1fr);
      gap:12px;
      padding:0 18px;
    }

    .service{
      border:0;
      background:#fff;
      border-radius:21px;
      padding:19px 16px;
      text-align:left;
      box-shadow:0 6px 20px rgba(7,29,56,.06);
    }

    .service-icon{
      font-size:23px;
      margin-bottom:12px;
    }

    .service strong{
      display:block;
      font-size:15px;
      margin-bottom:5px;
    }

    .service span{
      color:#718096;
      font-size:12px;
    }

    .transactions{
      margin:26px 18px 0;
      padding:19px;
      border-radius:22px;
      background:#fff;
      box-shadow:0 6px 20px rgba(7,29,56,.06);
    }

    .transactions-head{
      display:flex;
      justify-content:space-between;
      align-items:center;
      margin-bottom:16px;
    }

    .transactions-head strong{
      font-size:16px;
    }

    .transactions-head button{
      border:0;
      background:transparent;
      color:#087f79;
      font-size:12px;
      font-weight:800;
    }

    .empty{
      text-align:center;
      padding:18px 5px 10px;
      color:#718096;
      font-size:13px;
      line-height:1.5;
    }

    .empty-icon{
      font-size:28px;
      margin-bottom:7px;
    }

    .bottom-nav{
      position:fixed;
      left:50%;
      bottom:12px;
      transform:translateX(-50%);
      width:calc(100% - 24px);
      max-width:496px;
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:5px;
      padding:9px;
      border-radius:22px;
      background:rgba(255,255,255,.94);
      box-shadow:0 10px 35px rgba(7,29,56,.14);
      backdrop-filter:blur(15px);
      z-index:50;
    }

    .nav-btn{
      border:0;
      background:transparent;
      border-radius:15px;
      padding:9px 5px;
      color:#718096;
      font-size:11px;
      font-weight:800;
    }

    .nav-btn.active{
      background:#e9fbfa;
      color:#087f79;
    }

    .nav-icon{
      display:block;
      font-size:19px;
      margin-bottom:3px;
    }

    @media(max-width:350px){
      .balance-value{
        font-size:27px;
      }

      .service{
        padding:16px 13px;
      }
    }
  </style>
</head>

<body>

  <main class="app">

    <header class="header">

      <div class="brand">
        <div class="logo">MC</div>
        <div class="brand-name">MONEXA CASH</div>
      </div>

      <button
        class="profile-btn"
        type="button"
        aria-label="Profil">
        👤
      </button>

    </header>


    <section class="welcome">

      <small>Bienvenue 👋</small>

      <h1>
        Votre portefeuille numérique
      </h1>

    </section>


    <section class="balance">

      <div class="balance-label">
        Solde disponible
      </div>

      <div class="balance-value">
        0.00
        <span class="balance-currency">HTG</span>
      </div>

    </section>


    <section class="actions">

      <button class="action" type="button">
        <div class="action-icon">＋</div>
        Déposer
      </button>

      <button class="action" type="button">
        <div class="action-icon">↗</div>
        Envoyer
      </button>

      <button class="action" type="button">
        <div class="action-icon">↙</div>
        Retirer
      </button>

    </section>


    <div class="section-title">
      Services
    </div>


    <section class="services">

      <button class="service" type="button">
        <div class="service-icon">💳</div>
        <strong>Recharge</strong>
        <span>Wise, Meru, Morse, USDT et USDC</span>
      </button>

      <button class="service" type="button">
        <div class="service-icon">💸</div>
        <strong>Retrait</strong>
        <span>Recevez votre argent facilement</span>
      </button>

      <button class="service" type="button">
        <div class="service-icon">🎮</div>
        <strong>Free Fire</strong>
        <span>Achetez vos diamants</span>
      </button>

      <button class="service" type="button">
        <div class="service-icon">₿</div>
        <strong>Binance</strong>
        <span>Rechargez votre compte Binance</span>
      </button>

    </section>


    <section class="transactions">

      <div class="transactions-head">

        <strong>
          Transactions récentes
        </strong>

        <button type="button">
          Voir tout
        </button>

      </div>

      <div class="empty">

        <div class="empty-icon">
          ↕
        </div>

        Aucune transaction

        <br>

        Vos transactions apparaîtront ici.

      </div>

    </section>

  </main>


  <nav class="bottom-nav">

    <button class="nav-btn active" type="button">
      <span class="nav-icon">⌂</span>
      Accueil
    </button>

    <button class="nav-btn" type="button">
      <span class="nav-icon">▦</span>
      Services
    </button>

    <button class="nav-btn" type="button">
      <span class="nav-icon">↕</span>
      Transactions
    </button>

  </nav>

</body>
</html>
