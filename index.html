<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>MONEXA CASH</title>

  <style>
    *{
      box-sizing:border-box;
      margin:0;
      padding:0;
    }

    body{
      font-family:Arial,Helvetica,sans-serif;
      background:#f5f8fc;
      color:#10233f;
      min-height:100vh;
    }

    #app{
      width:100%;
      max-width:480px;
      min-height:100vh;
      margin:auto;
      background:#ffffff;
      padding:24px 18px;
    }

    .logo{
      width:58px;
      height:58px;
      border-radius:18px;
      background:#0b1f3a;
      color:#20d9d2;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:24px;
      font-weight:800;
      margin-bottom:18px;
    }

    h1{
      font-size:28px;
      margin-bottom:8px;
    }

    .subtitle{
      color:#667085;
      font-size:15px;
      line-height:1.5;
      margin-bottom:30px;
    }

    .test-card{
      background:#0b1f3a;
      color:#ffffff;
      border-radius:22px;
      padding:24px;
      box-shadow:0 12px 30px rgba(11,31,58,.15);
    }

    .test-card p{
      color:#d7e2f0;
      margin-top:8px;
      line-height:1.5;
    }

    button{
      width:100%;
      border:0;
      border-radius:14px;
      padding:14px;
      margin-top:20px;
      background:#20d9d2;
      color:#06252b;
      font-size:16px;
      font-weight:700;
      cursor:pointer;
    }
  </style>
</head>

<body>

  <div id="app">

    <div class="logo">MC</div>

    <h1>MONEXA CASH</h1>

    <p class="subtitle">
      Plateforme de services financiers numériques
    </p>

    <div class="test-card">
      <h2>Bienvenue</h2>
      <p>
        La nouvelle plateforme MONEXA CASH commence ici.
      </p>

      <button type="button" onclick="testMonexa()">
        Tester l'application
      </button>
    </div>

  </div>

  <script>
    function testMonexa(){
      alert("MONEXA CASH fonctionne correctement !");
    }
  </script>

</body>
</html>
