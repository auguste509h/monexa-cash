 <script>
(function(){

  function start(){

    const app=document.getElementById("app");

    if(!app){
      setTimeout(start,300);
      return;
    }

    if(!window.monexaSupabase){
      setTimeout(start,300);
      return;
    }

    function dashboard(){

      app.innerHTML=`
        <div class="mx-header">

          <div class="mx-brand">
            <div class="mx-logo">MC</div>
            <div class="mx-brand-name">MONEXA CASH</div>
          </div>

          <button
            class="mx-profile-btn"
            type="button"
            onclick="monexaOpenProfile()">
            👤
          </button>

        </div>

        <div class="mx-greeting">
          <small id="mx-user-greeting">Bonsoir 👋</small>
          <h2>Bienvenue sur MONEXA CASH</h2>
        </div>

        <div class="mx-balance">

          <div class="mx-balance-label">
            Solde disponible
          </div>

          <div class="mx-balance-value">
            0.00
            <span class="mx-balance-currency">HTG</span>
          </div>

        </div>

        <div class="mx-actions">

          <button
            class="mx-action"
            type="button"
            onclick="monexaOpenDeposit()">

            <div class="mx-action-icon">＋</div>
            Déposer

          </button>

          <button
            class="mx-action"
            type="button">

            <div class="mx-action-icon">↗</div>
            Envoyer

          </button>

          <button
            class="mx-action"
            type="button">

            <div class="mx-action-icon">↙</div>
            Retirer

          </button>

        </div>

        <div class="mx-section-title">
          Services
        </div>

        <div class="mx-services-card">

          <h3>MONEXA CASH</h3>

          <p>
            Votre portefeuille numérique simple,
            rapide et sécurisé.
          </p>

        </div>

      `;

    }

    function empty(){

      app.innerHTML="";

    }

    monexaSupabase.auth.getSession()
      .then(function(result){

        if(result.data && result.data.session){

          dashboard();

        }else{

          empty();

        }

      });

    monexaSupabase.auth.onAuthStateChange(
      function(event,session){

        if(session){

          setTimeout(dashboard,100);

        }else{

          empty();

        }

      }
    );

  }

  start();

})();


function monexaOpenProfile(){

  const panel=document.getElementById("mx-profile-panel");

  if(panel){
    panel.classList.add("active");
  }

}


function monexaCloseProfile(event){

  if(event && event.target!==event.currentTarget){
    return;
  }

  const panel=document.getElementById("mx-profile-panel");

  if(panel){
    panel.classList.remove("active");
  }

}
</script>

    const extra=document.createElement("div");

    extra.id="mx-profile-extra";

    extra.innerHTML=`
      <div class="mx-profile-avatar">
        👤

      <div class="mx-profile-center">
        <h3>Mon compte</h3>
        <p>Gérez votre compte MONEXA CASH</p>

          <span>👤</span>
          Informations personnelles
        </button>

        <button
          type="button"
          class="mx-profile-action"
          onclick="monexaProfileTest('Historique des transactions')">
          <span>↕</span>
          Historique des transactions
        </button>

        <div class="mx-profile-action mx-dark-row">

          <div>
            <span>🌙</span>
            Mode sombre
          </div>

          <label class="mx-switch">
            <input
              id="mx-dark-toggle"
              type="checkbox"
              onchange="monexaToggleDark(this)">
            <span class="mx-slider"></span>
          </label>

        </div>

        <button
          type="button"
          class="mx-profile-action"
          onclick="monexaProfileTest('Assistance')">
          <span>🆘</span>
          Assistance
        </button>

      </div>

      <div class="mx-help-box">

        <strong>Besoin d'aide ?</strong>

        <p>
          Si l'assistance n'est pas disponible,
          vous pouvez nous contacter directement sur WhatsApp.
        </p>

        <a
          class="mx-whatsapp-link"
          href="https://wa.me/50940886629"
          target="_blank"
          rel="noopener noreferrer">
          💬 Contacter MONEXA CASH sur WhatsApp
        </a>

      </div>
    `;

    profileBox.appendChild(extra);

    const savedTheme=localStorage.getItem("monexa_dark_mode");

    if(savedTheme==="true"){

      document.body.classList.add("mx-dark");

      const toggle=document.getElementById("mx-dark-toggle");

      if(toggle){
        toggle.checked=true;
      }
    }
  });

  function monexaToggleDark(input){

    const enabled=input.checked;

    document.body.classList.toggle("mx-dark",enabled);

    localStorage.setItem(
      "monexa_dark_mode",
      enabled ? "true" : "false"
    );
  }

      section +
      "\n\nCette fonction sera connectée au compte client dans une prochaine étape."
    );
  }
</script>

  async function monexaLoginTest(){

    const email=document.getElementById(
      "mx-auth-email"
    ).value.trim();

    const password=document.getElementById(
      "mx-auth-password"
    ).value;

    const message=document.getElementById(
      "mx-auth-message"
    );

    if(!email || !password){

      monexaAuthMessage(
        "Veuillez remplir tous les champs.",
        "error"
      );

      return;
    }

    monexaAuthMessage(
      "Connexion en cours...",

    const result=
      await monexaSupabase.auth.signInWithPassword({

<script>
  document.addEventListener("DOMContentLoaded",function(){

    const authCard=document.querySelector(

    if(!document.getElementById("mx-register-link")){

      button.id="mx-register-link";
      button.type="button";
      button.className="mx-register-link";
      button.textContent="Créer un compte";
      button.onclick=monexaOpenRegister;

      authCard.appendChild(button);

    if(document.getElementById("mx-register-screen")){
      return;
    }

    const screen=document.createElement("section");

    screen.id="mx-register-screen";
    screen.className="mx-register-screen";

    screen.innerHTML=`
      <div class="mx-register-box">

        <div class="mx-auth-brand">
          <div class="mx-auth-logo">MC</div>

          <div class="mx-auth-name">
            MONEXA CASH
          </div>

          </div>

            Adresse email
          </label>

            class="mx-register-input"
            type="email"
            autocomplete="email"

          </label>

          <label class="mx-register-label">

            type="button"
            class="mx-register-button"
            onclick="monexaRegister()">
            Créer mon compte
          </button>

            id="mx-register-message"
            class="mx-register-message">
          </div>

        </div>

      </div>
    `;

    document.body.appendChild(screen);

  });

  function monexaOpenRegister(){

    const screen=document.getElementById(
      "mx-register-screen"
    );

    const auth=document.getElementById(
      "mx-auth-screen"
    );

    if(auth){
      auth.classList.remove("show");
    }

    if(screen){
      screen.classList.add("show");
    }

  }

  async function monexaRegister(){

    const name=document.getElementById(
      "mx-register-name"
    ).value.trim();

    const email=document.getElementById(
      "mx-register-email"
    ).value.trim();

    const phone=document.getElementById(
      "mx-register-phone"
    ).value.trim();

    const password=document.getElementById(
      "mx-register-password"
    ).value;

    const confirm=document.getElementById(
      "mx-register-confirm"
    ).value;

    if(!name || !email || !phone || !password || !confirm){

      monexaRegisterMessage(
        "Veuillez remplir tous les champs.",
        "error"
      );

      return;
    }

    if(password.length < 6){

      monexaRegisterMessage(
        "Le mot de passe doit contenir au moins 6 caractères.",
        "error"
      );

      return;
    }

    if(password !== confirm){

      monexaRegisterMessage(
        "Les mots de passe ne correspondent pas.",
        "error"
      );

      return;
    }

    monexaRegisterMessage(
      "Création du compte en cours...",
      "success"
    );

    const result=
      await monexaSupabase.auth.signUp({
        email:email,
        password:password,
        options:{
          data:{
            full_name:name,
            phone:phone
          }
        }
      });

    if(result.error){

      monexaRegisterMessage(
        result.error.message,
        "error"
      );

      return;
    }

    monexaRegisterMessage(
      "Compte créé avec succès. Vérifiez votre email si une confirmation est demandée.",
      "success"
    );

  }

  function monexaRegisterMessage(text,type){

    const message=document.getElementById(
      "mx-register-message"
    );

    if(!message){
      return;
    }

    message.textContent=text;

    message.className=
      "mx-register-message show " + type;

  }

  <script>
(function(){

  async function monexaShowUserName(){

    if(!window.monexaSupabase) return;

    const result=await monexaSupabase.auth.getUser();

    if(result.error || !result.data || !result.data.user) return;

    const user=result.data.user;

    const name=
      user.user_metadata?.full_name ||
      user.user_metadata?.name ||
      user.email?.split("@")[0] ||
      "Client";

    function findGreeting(){

      document.querySelectorAll("body *").forEach(function(el){

        if(
          el.children.length===0 &&
          el.textContent.trim()==="Bonsoir 👋"
        ){
          el.textContent="Bonsoir, "+name+" 👋";
        }

      });

    }

    findGreeting();

    const observer=new MutationObserver(function(){
      findGreeting();
    });

    observer.observe(document.body,{
      childList:true,
      subtree:true
    });

    setTimeout(function(){
      observer.disconnect();
    },10000);

  }

  if(document.readyState==="loading"){
    document.addEventListener("DOMContentLoaded",monexaShowUserName);
  }else{
    monexaShowUserName();
  }

})();
  </script>

      if(result.data && result.data.session){

      if(session){

        app.style.display="";

        const start=document.getElementById("mx-start-screen");

        if(start){
          start.remove();
        }

      }else{

        app.style.display="none";

      }

    });

  }

  if(document.readyState==="loading"){

    document.addEventListener(
      "DOMContentLoaded",
      monexaProtectDashboard
    );

  }else{

})();
