<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>MONEXA CASH</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #172033;
      transition: .3s;
    }

    header {
      background: #0b1f3a;
      color: white;
      padding: 18px 15px;
    }

    .topbar {
      max-width: 600px;
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .top-button {
      width: auto;
      margin: 0;
      padding: 10px 13px;
      background: rgba(255,255,255,.12);
      border-radius: 10px;
      font-size: 14px;
      color: white;
      border: 0;
    }

    .brand {
      text-align: center;
      flex: 1;
    }

    .brand h1 {
      margin: 0;
      font-size: 23px;
    }

    .brand p {
      margin: 5px 0 0;
      font-size: 12px;
      opacity: .85;
    }

    .container {
      max-width: 600px;
      margin: auto;
      padding: 20px;
    }

    .card {
      background: white;
      padding: 22px;
      border-radius: 16px;
      margin-top: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,.06);
    }

    input,
    select {
      width: 100%;
      padding: 14px;
      margin-top: 10px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 15px;
      background: white;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 15px;
      border: 0;
      border-radius: 10px;
      background: #0b1f3a;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
      cursor: wait;
    }

    .link {
      background: transparent;
      color: #0b1f3a;
    }

    .hidden {
      display: none !important;
    }

    #message,
    #registerMessage,
    #photoMessage {
      margin-top: 15px;
      padding: 10px;
      text-align: center;
      font-size: 14px;
    }

    .services {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-top: 20px;
    }

    .service {
      background: #f7f9fc;
      border: 1px solid #e2e7ef;
      border-radius: 14px;
      padding: 20px 10px;
      text-align: center;
      cursor: pointer;
    }

    .service-icon {
      font-size: 30px;
      margin-bottom: 8px;
    }

    .service-name {
      font-weight: bold;
      font-size: 15px;
    }

    #serviceMessage {
      margin-top: 20px;
      padding: 15px;
      background: #eef3f9;
      border-radius: 10px;
      text-align: center;
      font-weight: bold;
    }

    .menu {
      position: fixed;
      top: 0;
      right: 0;
      width: 290px;
      max-width: 85%;
      height: 100%;
      background: white;
      z-index: 1000;
      padding: 20px;
      box-shadow: -5px 0 20px rgba(0,0,0,.15);
      transform: translateX(100%);
      transition: .25s;
      overflow-y: auto;
    }

    .menu.open {
      transform: translateX(0);
    }

    .menu h2 {
      margin-top: 20px;
    }

    .menu-item {
      width: 100%;
      margin-top: 10px;
      padding: 14px;
      border-radius: 10px;
      background: #f4f7fb;
      color: #172033;
      text-align: left;
    }

    .close-menu {
      background: #0b1f3a;
      color: white;
    }

    .profile-box {
      text-align: center;
    }

    .profile-icon {
      font-size: 55px;
    }

    #profilePhoto {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      object-fit: cover;
      display: none;
      margin: auto;
    }

    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.35);
      z-index: 999;
    }

    .dark {
      background: #101827;
      color: #f4f7fb;
    }

    .dark .card,
    .dark .menu {
      background: #182235;
      color: white;
    }

    .dark .service,
    .dark .menu-item,
    .dark #serviceMessage {
      background: #222e43;
      border-color: #33415c;
      color: white;
    }

    .dark input,
    .dark select {
      background: #222e43;
      color: white;
      border-color: #45536d;
    }

    .dark .link {
      color: white;
    }

    .notice {
      background: #eef3f9;
      padding: 14px;
      border-radius: 10px;
      margin-top: 15px;
      font-size: 14px;
      line-height: 1.5;
    }

    .payment-box {
      background: #fff7df;
      border: 1px solid #ead28a;
      padding: 15px;
      border-radius: 12px;
      margin-top: 15px;
      line-height: 1.6;
    }

    @media (max-width: 400px) {
      .services {
        grid-template-columns: 1fr;
      }

      .brand h1 {
        font-size: 19px;
      }
    }
  </style>
</head>

<body>

<header>

  <div class="topbar">

    <button
      class="top-button"
      id="profileButton">
      👤 Profil
    </button>

    <div class="brand">
      <h1>MONEXA CASH</h1>
      <p>Plateforme de services financiers numériques</p>
    </div>

    <button
      class="top-button"
      id="menuButton">
      ☰
    </button>

  </div>

</header>


<div id="overlay" class="overlay hidden"></div>


<div id="sideMenu" class="menu">

  <button
    class="close-menu"
    id="closeMenu">
    ✕ Fermer
  </button>

  <h2>Menu</h2>

  <button class="menu-item" id="countryButton">
    🌍 Pays
  </button>

  <button class="menu-item" id="darkButton">
    🌙 Mode sombre
  </button>

  <button class="menu-item" id="referralButton">
    🎟️ Code de parrainage
  </button>

  <button class="menu-item" id="settingsButton">
    ⚙️ Paramètres
  </button>

  <button class="menu-item" id="helpButton">
    ❓ Assistance
  </button>

  <button class="menu-item" id="menuLogoutButton">
    🚪 Déconnexion
  </button>

</div>


<div class="container">

  <!-- ========================= -->
  <!-- LOGIN -->
  <!-- ========================= -->

  <div id="loginSection" class="card">

    <h2>Connexion</h2>

    <input
      type="email"
      id="email"
      placeholder="Adresse e-mail">

    <input
      type="password"
      id="password"
      placeholder="Mot de passe">

    <button id="loginButton">
      Se connecter
    </button>

    <button
      class="link"
      id="registerButton">
      Créer un compte
    </button>

    <div id="message"></div>

  </div>


  <!-- ========================= -->
  <!-- REGISTER -->
  <!-- ========================= -->

  <div id="registerSection" class="card hidden">

    <h2>Créer un compte</h2>

    <input
      type="text"
      id="registerName"
      placeholder="Nom complet">

    <input
      type="email"
      id="registerEmail"
      placeholder="Adresse e-mail">

    <input
      type="tel"
      id="registerPhone"
      placeholder="Téléphone">

    <input
      type="password"
      id="registerPassword"
      placeholder="Mot de passe">

    <button id="createAccountButton">
      Créer mon compte
    </button>

    <button
      class="link"
      id="backLoginButton">
      ← Retour à la connexion
    </button>

    <div id="registerMessage"></div>

  </div>


  <!-- ========================= -->
  <!-- DASHBOARD -->
  <!-- ========================= -->

  <div id="dashboard" class="card hidden">

    <!-- PROFILE -->

    <div id="profileSection" class="profile-box hidden">

      <img
        id="profilePhoto"
        src=""
        alt="Photo de profil">

      <div
        id="defaultProfileIcon"
        class="profile-icon">
        👤
      </div>

      <h2>Mon profil</h2>

      <p id="profileEmail"></p>

      <input
        type="file"
        id="profilePhotoInput"
        accept="image/*">

      <button id="uploadPhotoButton">
        📷 Ajouter une photo
      </button>

      <p id="photoMessage"></p>

      <button id="backDashboard">
        ← Retour
      </button>

    </div>


    <!-- MAIN DASHBOARD -->

    <div id="mainDashboard">

      <h2>Bienvenue 👋</h2>

      <p id="userEmail"></p>

      <h3>Nos services</h3>

      <div class="services">

        <div class="service" data-service="Recharge">
          <div class="service-icon">💳</div>
          <div class="service-name">Recharge</div>
        </div>

        <div class="service" data-service="Retrait">
          <div class="service-icon">🏦</div>
          <div class="service-name">Retrait</div>
        </div>

        <div class="service" data-service="Free Fire">
          <div class="service-icon">🎮</div>
          <div class="service-name">Free Fire</div>
        </div>

        <div class="service" data-service="Crypto">
          <div class="service-icon">🪙</div>
          <div class="service-name">Crypto</div>
        </div>

        <div class="service" data-service="Binance">
          <div class="service-icon">🟡</div>
          <div class="service-name">Binance</div>
        </div>

        <div class="service" data-service="Création de carte">
          <div class="service-icon">💳</div>
          <div class="service-name">Création de carte</div>
        </div>

      </div>

      <div id="serviceMessage">
        Sélectionnez un service.
      </div>

      <button id="logoutButton">
        Se déconnecter
      </button>

    </div>

  </div>

</div>


<script>

document.addEventListener(
  "DOMContentLoaded",
  async function () {


  // =========================
  // SUPABASE
  // =========================

  if (!window.supabase) {

    document.body.innerHTML =
      "<div style='padding:30px;font-family:Arial;text-align:center'>" +
      "<h2>Erreur de chargement</h2>" +
      "<p>Supabase n'a pas pu être chargé.</p>" +
      "</div>";

    return;
  }


  const SUPABASE_URL =
    "https://nakaajakjrefzmacqlhv.supabase.co";

  const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_KVnwapImIKdKXMFZh5e9IA_7UflvhaN";

  const db =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );


  // =========================
  // ELEMENTS
  // =========================

  const loginSection =
    document.getElementById(
      "loginSection"
    );

  const registerSection =
    document.getElementById(
      "registerSection"
    );

  const dashboard =
    document.getElementById(
      "dashboard"
    );

  const message =
    document.getElementById(
      "message"
    );


  // =========================
  // PROFILE PHOTO
  // =========================

  async function loadProfilePhoto() {

    try {

      const {
        data
      } =
        await db.auth.getSession();

      const user =
        data.session?.user;

      if (!user) return;


      const {
        data: profile,
        error
      } =
        await db
          .from("profiles")
          .select("avatar_url")
          .eq("id", user.id)
          .single();


      if (
        error ||
        !profile ||
        !profile.avatar_url
      ) {
        return;
      }


      const {
        data: signedData
      } =
        await db.storage
          .from("profile-photos")
          .createSignedUrl(
            profile.avatar_url,
            3600
          );


      if (
        !signedData ||
        !signedData.signedUrl
      ) {
        return;
      }


      document
        .getElementById(
          "profilePhoto"
        )
        .src =
        signedData.signedUrl;


      document
        .getElementById(
          "profilePhoto"
        )
        .style.display =
        "block";


      document
        .getElementById(
          "defaultProfileIcon"
        )
        .style.display =
        "none";


    } catch (error) {

      console.log(
        "Photo error:",
        error
      );

    }

  }


  // =========================
  // SHOW DASHBOARD
  // =========================

  async function showDashboard(user) {

    loginSection.classList.add(
      "hidden"
    );

    registerSection.classList.add(
      "hidden"
    );

    dashboard.classList.remove(
      "hidden"
    );


    document
      .getElementById(
        "userEmail"
      )
      .textContent =
      user.email || "";


    document
      .getElementById(
        "profileEmail"
      )
      .textContent =
      user.email || "";


    await loadProfilePhoto();

  }


  // =========================
  // LOGIN
  // =========================

  document
    .getElementById(
      "loginButton"
    )
    .addEventListener(
      "click",
      async function () {


      const email =
        document
          .getElementById(
            "email"
          )
          .value
          .trim();


      const password =
        document
          .getElementById(
            "password"
          )
          .value;


      if (
        !email ||
        !password
      ) {

        message.textContent =
          "Veuillez entrer votre e-mail et votre mot de passe.";

        return;
      }


      message.textContent =
        "Connexion en cours...";


      try {

        const {
          data,
          error
        } =
          await db.auth.signInWithPassword({
            email: email,
            password: password
          });


        if (error) {

          message.textContent =
            "Erreur : " +
            error.message;

          return;
        }


        if (
          !data ||
          !data.user
        ) {

          message.textContent =
            "Connexion impossible.";

          return;
        }


        message.textContent =
          "Connexion réussie ✅";


        await showDashboard(
          data.user
        );


      } catch (error) {

        console.log(error);

        message.textContent =
          "Erreur : " +
          error.message;

      }

    });


  // =========================
  // REGISTER SCREEN
  // =========================

  document
    .getElementById(
      "registerButton"
    )
    .addEventListener(
      "click",
      function () {

        loginSection.classList.add(
          "hidden"
        );

        registerSection.classList.remove(
          "hidden"
        );

      }
    );


  document
    .getElementById(
      "backLoginButton"
    )
    .addEventListener(
      "click",
      function () {

        registerSection.classList.add(
          "hidden"
        );

        loginSection.classList.remove(
          "hidden"
        );

      }
    );


  // =========================
  // CREATE ACCOUNT
  // =========================

  document
    .getElementById(
      "createAccountButton"
    )
    .addEventListener(
      "click",
      async function () {


      const name =
        document
          .getElementById(
            "registerName"
          )
          .value
          .trim();


      const email =
        document
          .getElementById(
            "registerEmail"
          )
          .value
          .trim();


      const phone =
        document
          .getElementById(
            "registerPhone"
          )
          .value
          .trim();


      const password =
        document
          .getElementById(
            "registerPassword"
          )
          .value;


      const registerMessage =
        document.getElementById(
          "registerMessage"
        );


      if (
        !name ||
        !email ||
        !password
      ) {

        registerMessage.textContent =
          "Veuillez remplir les champs obligatoires.";

        return;
      }


      if (password.length < 6) {

        registerMessage.textContent =
          "Le mot de passe doit contenir au moins 6 caractères.";

        return;
      }


      registerMessage.textContent =
        "Création du compte...";


      try {

        const {
          data,
          error
        } =
          await db.auth.signUp({

            email: email,

            password: password,

            options: {

              data: {

                full_name:
                  name,

                phone:
                  phone

              }

            }

          });


        if (error) {

          registerMessage.textContent =
            "Erreur : " +
            error.message;

          return;
        }


        registerMessage.textContent =
          "Compte créé avec succès ✅";


        if (
          data.session &&
          data.user
        ) {

          await showDashboard(
            data.user
          );

        } else {

          registerMessage.textContent =
            "Compte créé ✅ Vérifiez votre e-mail si une confirmation est demandée.";

        }


      } catch (error) {

        registerMessage.textContent =
          "Erreur : " +
          error.message;

      }

    });


  // =========================
  // LOGOUT
  // =========================

  async function logout() {

    await db.auth.signOut();

    location.reload();

  }


  document
    .getElementById(
      "logoutButton"
    )
    .addEventListener(
      "click",
      logout
    );


  document
    .getElementById(
      "menuLogoutButton"
    )
    .addEventListener(
      "click",
      logout
    );


  // =========================
  // SERVICES
  // =========================

  document
    .querySelectorAll(
      ".service"
    )
    .forEach(
      function (service) {

        service.addEventListener(
          "click",
          function () {

            const name =
              service.getAttribute(
                "data-service"
              );


            document
              .getElementById(
                "serviceMessage"
              )
              .textContent =
              "Service sélectionné : " +
              name;

          }
        );

      }
    );


  // =========================
  // MENU
  // =========================

  const menu =
    document.getElementById(
      "sideMenu"
    );

  const overlay =
    document.getElementById(
      "overlay"
    );


  function openMenu() {

    menu.classList.add(
      "open"
    );

    overlay.classList.remove(
      "hidden"
    );

  }


  function closeMenu() {

    menu.classList.remove(
      "open"
    );

    overlay.classList.add(
      "hidden"
    );

  }


  document
    .getElementById(
      "menuButton"
    )
    .addEventListener(
      "click",
      openMenu
    );


  document
    .getElementById(
      "closeMenu"
    )
    .addEventListener(
      "click",
      closeMenu
    );


  overlay.addEventListener(
    "click",
    closeMenu
  );


  // =========================
  // PROFILE
  // =========================

  document
    .getElementById(
      "profileButton"
    )
    .addEventListener(
      "click",
      function () {

        dashboard.classList.remove(
          "hidden"
        );

        document
          .getElementById(
            "mainDashboard"
          )
          .classList.add(
            "hidden"
          );

        document
          .getElementById(
            "profileSection"
          )
          .classList.remove(
            "hidden"
          );

        closeMenu();

      }
    );


  document
    .getElementById(
      "backDashboard"
    )
    .addEventListener(
      "click",
      function () {

        document
          .getElementById(
            "profileSection"
          )
          .classList.add(
            "hidden"
          );

        document
          .getElementById(
            "mainDashboard"
          )
          .classList.remove(
            "hidden"
          );

      }
    );


  // =========================
  // DARK MODE
  // =========================

  document
    .getElementById(
      "darkButton"
    )
    .addEventListener(
      "click",
      function () {

        document.body.classList.toggle(
          "dark"
        );

      }
    );


  // =========================
  // MENU OPTIONS
  // =========================

  document
    .getElementById(
      "countryButton"
    )
  
    .addEventListener(
      "click",
      function () {
        alert("Pays : République dominicaine / Haïti");
      }
    );

  document
    .getElementById(
      "darkButton"
    )
    .addEventListener(
      "click",
      function () {
        document.body.classList.toggle("dark");
        localStorage.setItem(
          "monexa_dark",
          document.body.classList.contains("dark") ? "1" : "0"
        );
      }
    );

  document
    .getElementById(
      "referralButton"
    )
    .addEventListener(
      "click",
      function () {
        alert("Votre code de parrainage sera disponible prochainement.");
      }
    );

  document
    .getElementById(
      "settingsButton"
    )
    .addEventListener(
      "click",
      function () {
        alert("Les paramètres seront disponibles prochainement.");
      }
    );

  document
    .getElementById(
      "helpButton"
    )
    .addEventListener(
      "click",
      function () {
        alert("Assistance MONEXA CASH : contactez le service client.");
      }
    );

  document
    .getElementById(
      "logoutButton"
    )
    .addEventListener(
      "click",
      async function () {
        await supabase.auth.signOut();
        location.reload();
      }
    );

  if (
    localStorage.getItem("monexa_dark") === "1"
  ) {
    document.body.classList.add("dark");
  }

  supabase.auth
    .getSession()
    .then(function ({ data }) {
      if (data.session) {
        currentUser = data.session.user;
        showDashboard();
      }
    });

</script>

</body>
</html>
