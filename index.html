<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MONEXA CASH</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #172033;
      transition: 0.3s;
    }

    header {
      background: #0b1f3a;
      color: white;
      padding: 18px 15px;
    }

    .topbar {
      max-width: 600px;
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .top-button {
      width: auto;
      margin: 0;
      padding: 10px 13px;
      background: rgba(255,255,255,0.12);
      border-radius: 10px;
      font-size: 14px;
    }

    .brand {
      text-align: center;
      flex: 1;
    }

    .brand h1 {
      margin: 0;
      font-size: 23px;
    }

    .brand p {
      margin: 5px 0 0;
      font-size: 12px;
      opacity: .85;
    }

    .container {
      max-width: 600px;
      margin: auto;
      padding: 20px;
    }

    .card {
      background: white;
      padding: 22px;
      border-radius: 16px;
      margin-top: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,.06);
    }

    input,
    select {
      width: 100%;
      padding: 14px;
      margin-top: 10px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 15px;
      background: white;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 15px;
      border: 0;
      border-radius: 10px;
      background: #0b1f3a;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .link {
      background: transparent;
      color: #0b1f3a;
    }

    .hidden {
      display: none !important;
    }

    #message {
      margin-top: 15px;
      padding: 12px;
      text-align: center;
    }

    .services {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
      margin-top: 20px;
    }

    .service {
      background: #f7f9fc;
      border: 1px solid #e2e7ef;
      border-radius: 14px;
      padding: 20px 10px;
      text-align: center;
      cursor: pointer;
    }

    .service-icon {
      font-size: 30px;
      margin-bottom: 8px;
    }

    .service-name {
      font-weight: bold;
      font-size: 15px;
    }

    #serviceMessage {
      margin-top: 20px;
      padding: 15px;
      background: #eef3f9;
      border-radius: 10px;
      text-align: center;
      font-weight: bold;
    }

    .menu {
      position: fixed;
      top: 0;
      right: 0;
      width: 290px;
      max-width: 85%;
      height: 100%;
      background: white;
      z-index: 1000;
      padding: 20px;
      box-shadow: -5px 0 20px rgba(0,0,0,.15);
      transform: translateX(100%);
      transition: .25s;
    }

    .menu.open {
      transform: translateX(0);
    }

    .menu h2 {
      margin-top: 5px;
    }

    .menu-item {
      width: 100%;
      margin-top: 10px;
      padding: 14px;
      border-radius: 10px;
      background: #f4f7fb;
      color: #172033;
      text-align: left;
    }

    .close-menu {
      background: #0b1f3a;
      color: white;
    }

    .profile-box {
      text-align: center;
    }

    .profile-icon {
      font-size: 55px;
    }

    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.35);
      z-index: 999;
    }

    .dark {
      background: #101827;
      color: #f4f7fb;
    }

    .dark .card,
    .dark .menu {
      background: #182235;
      color: white;
    }

    .dark .service,
    .dark .menu-item,
    .dark #serviceMessage {
      background: #222e43;
      border-color: #33415c;
      color: white;
    }

    .dark input,
    .dark select {
      background: #222e43;
      color: white;
      border-color: #45536d;
    }

    .dark .link {
      color: white;
    }

    @media (max-width: 400px) {
      .services {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

<header>

  <div class="topbar">

    <button
      class="top-button"
      id="profileButton">
      👤 Profil
    </button>

    <div class="brand">
      <h1>MONEXA CASH</h1>
      <p>Plateforme de services financiers numériques</p>
    </div>

    <button
      class="top-button"
      id="menuButton">
      ☰
    </button>

  </div>

</header>


<div id="overlay" class="overlay hidden"></div>


<div id="sideMenu" class="menu">

  <button
    class="close-menu"
    id="closeMenu">
    ✕ Fermer
  </button>

  <h2>Menu</h2>

  <button class="menu-item" id="countryButton">
    🌍 Pays
  </button>

  <button class="menu-item" id="darkButton">
    🌙 Mode sombre
  </button>

  <button class="menu-item" id="referralButton">
    🎟️ Code de parrainage
  </button>

  <button class="menu-item" id="settingsButton">
    ⚙️ Paramètres
  </button>

  <button class="menu-item" id="helpButton">
    ❓ Assistance
  </button>

</div>


<div class="container">

  <div id="loginSection" class="card">

    <h2>Connexion</h2>

    <input
      type="email"
      id="email"
      placeholder="Adresse e-mail">

    <input
      type="password"
      id="password"
      placeholder="Mot de passe">

    <button id="loginButton">
      Se connecter
    </button>

    <button
      class="link"
      id="registerButton">
      Créer un compte
    </button>

    <div id="message"></div>

  </div>


  <div id="dashboard" class="card hidden">

    <div id="profileSection" class="profile-box hidden">

      <div class="profile-icon">👤</div>

      <h2>Mon profil</h2>

      <p id="profileEmail"></p>

      <button id="backDashboard">
        ← Retour
      </button>

    </div>


    <div id="mainDashboard">

      <h2>Bienvenue 👋</h2>

      <p id="userEmail"></p>

      <h3>Nos services</h3>

      <div class="services">

        <div class="service" data-service="Recharge">
          <div class="service-icon">💳</div>
          <div class="service-name">Recharge</div>
        </div>

        <div class="service" data-service="Retrait">
          <div class="service-icon">🏦</div>
          <div class="service-name">Retrait</div>
        </div>

        <div class="service" data-service="Free Fire">
          <div class="service-icon">🎮</div>
          <div class="service-name">Free Fire</div>
        </div>

        <div class="service" data-service="Crypto">
          <div class="service-icon">🪙</div>
          <div class="service-name">Crypto</div>
        </div>

        <div class="service" data-service="Binance">
          <div class="service-icon">🟡</div>
          <div class="service-name">Binance</div>
        </div>

        <div class="service" data-service="Création de carte">
          <div class="service-icon">💳</div>
          <div class="service-name">Création de carte</div>
        </div>

      </div>

      <div id="serviceMessage">
        Sélectionnez un service.
      </div>

      <button id="logoutButton">
        Se déconnecter
      </button>

    </div>

  </div>

</div>


<script>

const SUPABASE_URL =
  "https://nakaajakjrefzmacqlhv.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_KVnwapImIKdKXMFZh5e9IA_7UflvhaN";

const db = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY
);


const loginButton =
  document.getElementById("loginButton");

const message =
  document.getElementById("message");


loginButton.addEventListener("click", async function() {

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;

  if (!email || !password) {

    message.textContent =
      "Veuillez entrer votre e-mail et votre mot de passe.";

    return;
  }

  message.textContent =
    "Connexion en cours...";


  const { data, error } =
    await db.auth.signInWithPassword({
      email: email,
      password: password
    });


  if (error) {

    message.textContent =
      error.message;

    return;
  }


  document
    .getElementById("loginSection")
    .classList.add("hidden");

  document
    .getElementById("dashboard")
    .classList.remove("hidden");

  document
    .getElementById("userEmail")
    .textContent =
    data.user.email;

  document
    .getElementById("profileEmail")
    .textContent =
    data.user.email;

});


document
  .getElementById("logoutButton")
  .addEventListener("click", async function() {

    await db.auth.signOut();

    location.reload();

  });


document
  .querySelectorAll(".service")
  .forEach(function(service) {

    service.addEventListener("click", function() {

      const serviceName =
        service.getAttribute("data-service");

      document
        .getElementById("serviceMessage")
        .textContent =
        "Service sélectionné : " + serviceName;

    });

  });


const menu =
  document.getElementById("sideMenu");

const overlay =
  document.getElementById("overlay");


function openMenu() {

  menu.classList.add("open");
  overlay.classList.remove("hidden");

}


function closeMenu() {

  menu.classList.remove("open");
  overlay.classList.add("hidden");

}


document
  .getElementById("menuButton")
  .addEventListener("click", openMenu);


document
  .getElementById("closeMenu")
  .addEventListener("click", closeMenu);


overlay.addEventListener("click", closeMenu);


document
  .getElementById("profileButton")
  .addEventListener("click", function() {

    document
      .getElementById("mainDashboard")
      .classList.add("hidden");

    document
      .getElementById("profileSection")
      .classList.remove("hidden");

  });


document
  .getElementById("backDashboard")
  .addEventListener("click", function() {

    document
      .getElementById("profileSection")
      .classList.add("hidden");

    document
      .getElementById("mainDashboard")
      .classList.remove("hidden");

  });


document
  .getElementById("darkButton")
  .addEventListener("click", function() {

    document.body.classList.toggle("dark");

  });


document
  .getElementById("countryButton")
  .addEventListener("click", function() {

    alert("La sélection du pays sera disponible prochainement.");

  });


document
  .getElementById("referralButton")
  .addEventListener("click", function() {

    alert("Le système de parrainage sera disponible prochainement.");

  });


document
  .getElementById("settingsButton")
  .addEventListener("click", function() {

    alert("Les paramètres seront disponibles prochainement.");

  });


document
  .getElementById("helpButton")
  .addEventListener("click", function() {

    alert("L'assistance MONEXA CASH sera disponible prochainement.");

  });

</script>

</body>
  </html>
